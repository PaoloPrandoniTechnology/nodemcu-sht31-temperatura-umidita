; PlatformIO Project Configuration File
;
;   Target: Wemos D1 Mini (ESP8266)
;   Sensori:
;     - 1x SHT31-D I²C su D1 (SCL, GPIO5) e D2 (SDA, GPIO4)
;     - I²C address 0x44 (ADDR pin LOW), HIGH repeatability
;   Sample rate: 1Hz
;   Output: seriale 115200 baud + pagina web via WebSocket + MQTT Home Assistant

[env:d1_mini]
platform      = espressif8266
board         = d1_mini
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
extra_scripts = post:scripts/post_build_copy_ota.py
lib_deps =
    links2004/WebSockets@^2.4.1
    knolleary/PubSubClient@^2.8
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D MQTT_KEEPALIVE=30
