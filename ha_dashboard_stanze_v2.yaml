title: Temperatura e umidità stanze
type: sections
sections:
  - heading: Condizioni in Tempo Reale
    subheading: Tutte le stanze · Andamento · Dettaglio · Diagnostica
    card_mod:
      style: |
        :host {
          max-width: none !important;
          width: 100% !important;
          padding: 20px 12px 28px 12px !important;
          background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.00) 12%);
          border-radius: 0 0 32px 32px;
        }
        .section-heading {
          padding: 8px 20px 14px 20px !important;
          margin-bottom: 4px !important;
        }
        .section-heading .heading {
          font-size: 18px !important;
          font-weight: 900 !important;
          letter-spacing: 0.4px !important;
        }
        .section-heading .subheading {
          font-size: 11px !important;
          font-weight: 600 !important;
          letter-spacing: 0.6px !important;
          opacity: 0.72 !important;
          margin-top: 3px !important;
        }
    cards:
      - type: horizontal-stack
        card_mod:
          style: |
            ha-card { width: 100% !important; max-width: none !important; margin-top: 0 !important; }
        cards:
          - type: entities
            title: BAGNO
            show_header_toggle: false
            card_mod:
              style: |
                ha-card {
                  border-radius: 22px;
                  border: 1px solid rgba(33,150,243,0.22);
                  background: linear-gradient(135deg, rgba(33,150,243,0.26) 0%, rgba(33,150,243,0.07) 50%, rgba(0,0,0,0.00) 100%);
                  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
                  box-shadow: 0 10px 30px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.06);
                  flex: 1 1 0% !important; min-width: 0 !important; width: 100% !important; max-width: none !important;
                  margin: 0 6px 0 0 !important;
                }
                .card-header {
                  font-size: 11px !important; font-weight: 900 !important; letter-spacing: 2.5px !important;
                  padding: 22px 28px 10px 28px !important; color: #BBDEFB;
                  display: flex !important; align-items: center !important;
                }
                .card-header ha-icon, .card-header .icon { display: none !important; width: 0 !important; min-width: 0 !important; flex: 0 0 0 !important; padding: 0 !important; margin: 0 !important; }
                #states > * { margin: 0 !important; }
                .card-content { padding: 4px 0 8px 0 !important; width: 100% !important; }
                .entity {
                  padding: 10px 28px !important;
                  width: 100% !important;
                  display: flex !important;
                  flex-direction: row !important;
                  justify-content: space-between !important;
                  align-items: baseline !important;
                  gap: 14px !important;
                }
                .entity .icon, .entity > * > .icon, .entity ha-icon, .entity * ha-icon { display: none !important; width: 0 !important; min-width: 0 !important; max-width: 0 !important; flex: 0 0 0 !important; padding: 0 !important; margin: 0 !important; overflow: hidden !important; }
                .entity .info, .entity .name {
                  font-size: 10px !important; font-weight: 700 !important; letter-spacing: 0.9px !important;
                  text-transform: uppercase !important; opacity: 0.78;
                  padding: 0 !important; line-height: 1.2 !important;
                  width: auto !important; min-width: 0 !important;
                  text-align: left !important;
                  flex: 0 0 auto !important;
                }
                .entity .state {
                  font-size: 40px !important; font-weight: 900 !important;
                  line-height: 1 !important; letter-spacing: -0.4px !important;
                  white-space: nowrap !important;
                  padding: 0 !important; margin: 0 !important;
                  width: auto !important; min-width: 0 !important;
                  text-align: right !important;
                  flex: 1 1 auto !important;
