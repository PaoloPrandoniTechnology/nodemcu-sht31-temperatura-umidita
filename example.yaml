      - type: heading
        heading: Rosa dei Venti
      - type: custom:windrose-card
        title: Distribuzione Direzione / Velocità
        data_period:
          period_back: -24h
        rose_config:
          windrose_draw_north_offset: 0
          center_circle:
            enabled: false
            text: ${calm-percentage}%
        refresh_interval: 500
        windspeed_bar_location: bottom
        wind_direction_entity:
          entity: sensor.stazione_meteo_esterna_heading_gradi
          use_statistics: true
          direction_compensation: 0
        windspeed_entities:
          - entity: sensor.stazione_meteo_esterna_velocita_vento
            name: Velocità vento
            speed_unit: kph
            use_statistics: true
            windspeed_bar_full: false
            output_speed_unit: kph
            speed_range_beaufort: true
            current_speed_arrow: true
        buttons_config:
          location: bottom
          buttons:
            - type: period_selector
              button_text: Oggi
              preset_period: today
            - type: period_selector
              button_text: Ultimi 7 giorni
              preset_period: last_7_days
            - type: period_selector
              button_text: Ultimi 30 giorni
              preset_period: last_30_days
              use_statistics: true
              statistics_period: 5minute
        direction_labels:
          cardinal_direction_letters: NESO
        current_direction:
          show_arrow: true
        matching_strategy:
          name: speed-first
        corner_info:
          top_left:
            label: Direzione vento
            unit: ' °'
            entity: sensor.stazione_meteo_esterna_heading_gradi
          top_right:
            label: Velocità vento
            unit: ' km/h'
            entity: sensor.stazione_meteo_esterna_velocita_vento_km_h
            input_unit: kph
            output_unit: kph
        text_blocks:
